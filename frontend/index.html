<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>GestureDoc Camera</title>
    <link rel="stylesheet" href="./styles.css?v=20260914.4">
  </head>
  <body>
    <main class="camera-shell" aria-label="Kontrol kamera GestureDoc">
      <div class="camera-toolbar">
        <button id="start-camera" type="button">Mulai kamera</button>
        <button id="stop-camera" type="button" disabled>Stop kamera</button>
        <button id="retry-camera" type="button" hidden>Coba lagi</button>
      </div>

      <section class="status-panel" aria-live="polite" aria-atomic="true">
        <div class="status-line">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="camera-status">Menyiapkan komponen…</span>
        </div>
        <p id="status-detail" class="status-detail"></p>
      </section>

      <section id="camera-stage" class="camera-stage" hidden>
        <video id="camera-video" autoplay playsinline muted></video>
        <canvas id="camera-canvas" width="640" height="480" aria-label="Pratinjau kamera dengan titik area tubuh"></canvas>
      </section>

      <section class="progress-panel">
        <label id="progress-label" for="dwell-progress">Arahkan telunjuk ke titik area tubuh</label>
        <progress id="dwell-progress" max="100" value="0">0%</progress>
      </section>

      <p class="privacy-note">
        Frame kamera diproses di perangkat dan tidak dikirim ke server aplikasi. Hanya ID area yang
        sudah dipilih yang diteruskan ke Streamlit.
      </p>
    </main>
    <script type="module" src="./src/app.js?v=20260914.4"></script>
  </body>
</html>
